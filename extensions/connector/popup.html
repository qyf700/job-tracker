<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>浏览器连接器</title><link rel="stylesheet" href="popup.css"></head><body><header><h1>投递连接器</h1><span>v0.4 · 知乎表单与附件</span></header><p>保持已登录的工作台标签页打开。登录、验证码和官网协议由本人处理。</p><button id="open">打开工作台 / 登录</button><section id="pair"><h2>配对本人设备</h2><label>设备名称<input id="name" maxlength="60" placeholder="例如：我的 Chrome"/></label><label>工作台配对码<input id="code" autocomplete="off" spellcheck="false" placeholder="从工作台「浏览器连接」复制"/></label><button id="pair-button">发送配对请求</button><button id="cancel-pair">清除待处理配对</button></section><section id="connected" hidden><h2 id="device"></h2><div id="active"></div><button id="tasks">读取可领取任务</button><label>本人已确认任务<select id="task-list"></select></label><button id="claim">领取并打开知乎官网</button><div class="actions"><button id="inspect">重新核对目标页（不填表）</button><button id="materials">读取本任务冻结材料摘要</button><button id="file">读取并校验冻结原件</button><button data-wait="needs_login">报告：等待本人登录</button><button data-wait="needs_verification">报告：等待本人验证码</button><button data-wait="needs_consent">报告：等待本人处理官网协议</button><h2>知乎 / Moka 材料传输</h2><button id="adapter-preview">扫描字段并预览匹配</button><pre id="adapter-plan"></pre><label><input type="checkbox" id="transmit-ack"/>我已核对岗位和冻结材料，同意将所选资料或简历原件传给此知乎/Moka申请页（上传可能触发解析），尚不提交申请</label><button id="adapter-upload">确认：上传此冻结简历原件</button><button id="adapter-fill">确认：填写可精确匹配的空白字段</button><p>建议先上传，等待官网解析完成，再预览并填写。已存在的内容不会覆盖；学校、专业选项及未识别控件请本人确认。</p><label><input type="checkbox" id="review-ack"/>我已在官网核对全部必填项、选项和已上传文件，准备进入最终确认（此按钮不提交）</label><button id="adapter-review">核对完成，停在最终提交前</button><label><input type="checkbox" id="clear-ack"/>我已核对上次官网操作，没有再次上传或填写；只清理本机待核对提示</label><button id="adapter-clear">清理本机提示（不重置官网记录）</button><button id="release">结束本次租约，保留操作记录</button></div><button id="disconnect">撤销本机授权</button></section><p id="status" role="status"></p><p class="note">仅在你确认后填写或上传；最终提交停下来由你确认。不会接受官网协议，不回传页面正文、验证码或 Cookie，也不会把附件选择当作投递成功。</p><script type="module" src="popup.mjs"></script></body></html>
