<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>官网填表助手</title></head><body><header><h1>官网填表助手</h1><p>核对后填入，不提交投递</p></header><section><label>导入工作台导出的资料 JSON<input id="import" type="file" accept=".json,application/json"></label><p id="profile-status">尚未导入个人资料</p><button id="clear" class="secondary">清除本机资料</button></section><section><button id="scan">扫描当前页</button><p id="site"></p><p class="hint">仅填写你选中的空白字段。验证码、附件、自定义下拉和跨域框架需手动处理。</p></section><div id="fields"></div><div id="controls" hidden><button id="export-fields" class="secondary">导出字段结构</button><button id="save-mapping" class="secondary">保存本页字段映射</button><button id="fill">填入已选字段</button><button id="undo" class="secondary">撤销上次填入</button></div><p id="message" role="status"></p><div id="result"></div><script type="module" src="popup.js"></script></body></html>
